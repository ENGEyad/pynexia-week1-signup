name: Verify hosted submission
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public page and downloadable files
        shell: python
        run: |
          import hashlib, urllib.request
          expected = {'index.html': '149a2b1c3515b0d7007c62f316ada177d557c71099862d6e65c11d8d445fd9b6', 'style.css': '05e20b0bb4f1aeceed487f519408a3653367eda7afce70ff50f56a39dfdd5d3c', 'script.js': '3e1ed7d88b16a69dc44115e02b034066c1fdb99c27f9ad65601fcff7f5a1b5be', 'downloads/Sign-Up-App.zip': '0a3e82674f91972dc710466b518863495d60eb5af1ff675319c61f90b17740a2', 'downloads/Sign-Up-App-Report.pdf': 'fcbd24889e5de240ac317acd84083c438579caf5902e2ed921bdf85f9367c722', 'downloads/Sign-Up-App.apk': '6aa56e2d89ac22d8b454e4c8d898702a8d79237f5eb78c19ad43c8061d6deb04'}
          base = 'https://engeyad.github.io/pynexia-week1-signup/'
          for path, digest in expected.items():
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  content = response.read()
                  assert response.status == 200
              assert hashlib.sha256(content).hexdigest() == digest, path
              print('HTTP 200 and SHA-256 match:', path)
